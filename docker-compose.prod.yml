services:
  db:
    image: postgres:16-alpine
    container_name: aevonfit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env — sem valor padrão por segurança}
      POSTGRES_DB: aevonfit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5438:5432'

  api:
    build: .
    container_name: aevonfit-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?defina DB_PASSWORD no .env}@db:5432/aevonfit
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env — sem valor padrão por segurança}
      JWT_EXPIRES_IN: 7d
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?defina ANTHROPIC_API_KEY no .env}
      PORT: 3000
    ports:
      - '127.0.0.1:4120:3000'

volumes:
  postgres_data:
